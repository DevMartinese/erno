<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Reachable by URL, linked from its flat twin, and asked to stay
         out of the indexes while the game is still being shaped. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Pattern · the chain, in glass</title>
    <meta name="description" content="The same voyage, told on a WebGL stage: voxels with depth, a camera the reader owns." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="../../site.css" />
    <link rel="stylesheet" href="./pattern.css" />
    <style>
      /* ─────────────────────────────────────────────────────────────────
         The flat page's own skin, minus every stacked SVG layer: the
         board side here is ONE canvas, and the depth is the canvas's
         to draw rather than the stylesheet's to fake.
         ───────────────────────────────────────────────────────────── */
      :root {
        --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
      }
      html, body.example { height: 100%; }
      body.example {
        display: flex;
        flex-direction: column;
        overflow: clip;
        max-width: 100rem;
        margin-inline: auto;
        border-inline: var(--rule) solid var(--ink);
      }
      .voyage-head {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-4);
        flex: 0 0 auto;
      }
      .voyage-mark {
        font-family: var(--mono);
        font-size: var(--size-sm);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .voyage-flat {
        font-family: var(--mono);
        font-size: var(--size-sm);
        color: color-mix(in oklab, var(--ink) 55%, var(--paper));
      }
      .voyage-count {
        margin-left: auto;
        font-family: var(--mono);
        font-size: var(--size-sm);
        color: color-mix(in oklab, var(--ink) 55%, var(--paper));
      }
      .voyage-ticks {
        display: flex;
        gap: 2px;
        padding: 0 var(--space-4) var(--space-2);
        flex: 0 0 auto;
      }
      .voyage-ticks button {
        flex: 1;
        height: 3px;
        padding: 0;
        border: 0;
        background: color-mix(in oklab, var(--ink) 16%, var(--paper));
        cursor: pointer;
        transition: background 240ms ease, transform 160ms var(--ease-strong);
      }
      .voyage-ticks button[aria-current="true"] { background: var(--red); }
      .voyage-ticks button:hover { background: color-mix(in oklab, var(--ink) 45%, var(--paper)); }
      .voyage-ticks button:active { transform: scaleY(2); }

      .voyage {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        min-height: 0;
        border-top: var(--rule) solid var(--ink);
      }
      .voyage-code {
        border-right: var(--rule) solid var(--ink);
        padding: var(--space-5) var(--space-4);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--space-3);
        min-height: 0;
      }
      .voyage-lede {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: var(--space-3);
        align-items: start;
      }
      .voyage-num {
        font-size: var(--size-3xl);
        font-weight: 900;
        font-stretch: 125%;
        line-height: 0.85;
        letter-spacing: -0.02em;
        min-width: 2.6ch;
      }
      .voyage-name {
        display: block;
        font-family: var(--mono);
        font-size: var(--size-sm);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: color-mix(in oklab, var(--ink) 60%, var(--paper));
        margin-bottom: var(--space-1);
      }
      .voyage-caption { min-height: 4.6em; margin: 0; max-width: 46ch; }
      .voyage-caption p {
        margin: 0;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 420ms var(--ease-strong), transform 420ms var(--ease-strong);
      }
      .voyage-caption p.is-leaving { opacity: 0; transform: translateY(-6px); }
      .voyage-caption p.is-entering { opacity: 0; transform: translateY(8px); }

      #voyage-lines {
        position: relative;
        overflow: visible;
        font-family: var(--mono);
        font-size: 1.05rem;
        line-height: 1.95;
        min-height: 10.4em;
        padding-left: var(--space-3);
        border-left: 3px solid var(--red);
        white-space: pre;
      }
      .cline {
        position: relative;
        min-height: 1.95em;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 420ms var(--ease-strong), transform 420ms var(--ease-strong);
      }
      .cline[data-text=""] { min-height: 0.9em; }
      .cline.is-new { opacity: 0; transform: translateY(10px); }
      .cline.is-gone {
        position: absolute;
        opacity: 0;
        transform: translateY(-8px);
        filter: blur(3px);
        transition: opacity 300ms var(--ease-strong), transform 300ms var(--ease-strong),
          filter 300ms var(--ease-strong);
      }
      .seg {
        display: inline-block;
        white-space: pre;
        transition: opacity 560ms var(--ease-strong), transform 560ms var(--ease-strong),
          filter 560ms var(--ease-strong);
      }
      .seg-in { opacity: 0; transform: translateY(8px); filter: blur(3px); }
      .seg-out { opacity: 0; transform: translateY(-5px); filter: blur(3px); }
      .tk-str { color: var(--blue); }
      .tk-num { color: var(--blue); }
      .tk-kw { color: color-mix(in oklab, var(--ink) 45%, var(--paper)); }
      .tk-fn { font-weight: 700; }
      .tk-src { font-weight: 700; color: var(--red); }

      .voyage-verdict {
        font-family: var(--mono);
        font-size: var(--size-sm);
        line-height: 1.6;
        min-height: 5.7em;
        max-width: 62ch;
        margin: 0;
        padding-left: var(--space-3);
        border-left: var(--rule) solid color-mix(in oklab, var(--ink) 18%, var(--paper));
        color: color-mix(in oklab, var(--ink) 78%, var(--paper));
        white-space: pre-wrap;
        transition: opacity 260ms var(--ease-strong);
      }
      .voyage-nav { display: flex; gap: var(--space-1); align-items: baseline; }
      .voyage-nav button { transition: transform 140ms var(--ease-strong); }
      .voyage-nav button:active { transform: scale(0.97); }
      .voyage-nav button[disabled] { opacity: 0.35; }
      .voyage-hint {
        font-family: var(--mono);
        font-size: var(--size-sm);
        color: color-mix(in oklab, var(--ink) 45%, var(--paper));
        margin-left: auto;
      }

      /* ── The glass side ────────────────────────────────────────────── */
      .voyage-board {
        display: grid;
        place-items: center;
        padding: var(--space-4);
        min-height: 0;
        position: relative;
      }
      #voyage-stage {
        width: min(96%, 44rem, 68vh);
        aspect-ratio: 1 / 1;
        cursor: grab;
        touch-action: none;
      }
      #voyage-stage:active { cursor: grabbing; }
      #voyage-stage canvas { width: 100%; height: 100%; display: block; }

      .voyage-controls {
        position: absolute;
        left: var(--space-4);
        bottom: var(--space-4);
        display: flex;
        gap: var(--space-1);
        align-items: baseline;
        font-family: var(--mono);
        font-size: var(--size-sm);
      }
      #voyage-refuse {
        max-width: 34ch;
        font-family: var(--mono);
        font-size: var(--size-sm);
        line-height: 1.7;
      }
      #voyage-refuse[hidden] { display: none; }

      #voyage-goal {
        z-index: 4;
        position: absolute;
        right: var(--space-4);
        bottom: var(--space-4);
        width: 8rem;
        border: var(--rule) solid var(--ink);
        padding: var(--space-1);
        background: var(--paper);
        opacity: 1;
        transform: translateY(0);
        transition: opacity 420ms var(--ease-strong), transform 420ms var(--ease-strong);
      }
      #voyage-goal[hidden] { display: none; }
      #voyage-goal.is-entering { opacity: 0; transform: translateY(8px); }
      #voyage-goal svg { width: 100%; height: auto; display: block; }
      #voyage-goal .example-label { display: block; margin-bottom: 0.3rem; }

      @media (max-width: 62rem) {
        .voyage { grid-template-columns: minmax(0, 1fr); }
        .voyage-code { border-right: none; border-top: var(--rule) solid var(--ink); order: 1; }
        .voyage-board { order: 0; min-height: 40vh; }
        body.example { overflow: auto; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cline, .seg, .voyage-caption p {
          transition-property: opacity;
          transition-duration: 150ms;
        }
      }
    </style>
  </head>
  <body class="example">
    <header class="voyage-head">
      <a class="example-back" href="./">erno</a>
      <span class="voyage-mark">the chain · in glass</span>
      <a class="voyage-flat" href="./chain.html">flat version</a>
      <span class="voyage-count" id="voyage-count"></span>
    </header>
    <nav class="voyage-ticks" id="voyage-dots" aria-label="Steps"></nav>

    <main class="voyage">
      <section class="voyage-code">
        <div class="voyage-lede">
          <span class="voyage-num" id="voyage-num"></span>
          <div>
            <span class="voyage-name" id="voyage-title"></span>
            <div class="voyage-caption"><p id="voyage-caption"></p></div>
          </div>
        </div>
        <div id="voyage-lines" aria-live="off"></div>
        <p class="voyage-verdict" id="voyage-verdict"></p>
        <div class="voyage-nav">
          <button id="voyage-prev">Back</button>
          <button id="voyage-next">Next</button>
          <span class="voyage-hint">arrow keys walk · drag orbits · the code is really running</span>
        </div>
      </section>

      <section class="voyage-board">
        <div id="voyage-stage"></div>
        <p id="voyage-refuse" hidden></p>
        <div class="voyage-controls">
          <label for="voyage-cubie" class="example-label">voxel</label>
          <select id="voyage-cubie">
            <option value="box">box</option>
            <option value="rounded">rounded</option>
          </select>
        </div>
        <div id="voyage-goal" hidden>
          <span class="example-label">the goal</span>
          <div id="voyage-goal-art"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./voyage3d.js"></script>
  </body>
</html>
