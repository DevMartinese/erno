<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pattern · the chain</title>
    <meta name="description" content="One fluent value, transformed link by link. The journey through Pattern's chained language, in one screen." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="../../site.css" />
    <link rel="stylesheet" href="./pattern.css" />
    <style>
      :root {
        --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-move: cubic-bezier(0.77, 0, 0.175, 1);
      }
      html, body.example { height: 100%; }
      body.example {
        display: flex;
        flex-direction: column;
        /* clip, not hidden: a clipped box cannot be scrolled even
           programmatically, so a focused button can never shove the
           sheet and reveal slivers of the panel below */
        overflow: clip;
        max-width: 100rem;
        margin-inline: auto;
        border-inline: var(--rule) solid var(--ink);
      }

      /* ── The masthead: one quiet row ─────────────────────────────────── */
      .voyage-head {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        border-bottom: var(--rule) solid var(--ink);
        flex: 0 0 auto;
      }
      .voyage-head h1 {
        font-size: var(--size-xl);
        margin: 0;
      }
      .voyage-step-title {
        font-family: var(--mono);
        font-size: var(--size-sm);
        transition: opacity 200ms var(--ease-strong);
      }
      .voyage-dots {
        margin-left: auto;
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      .voyage-dots button {
        width: 0.55rem;
        height: 0.55rem;
        padding: 0;
        border: var(--rule) solid var(--ink);
        background: transparent;
        cursor: pointer;
        transition: background 200ms ease, transform 140ms var(--ease-strong);
      }
      .voyage-dots button[aria-current="true"] { background: var(--ink); }
      .voyage-dots button:active { transform: scale(0.9); }

      /* ── The stage: two panels, one screen ───────────────────────────── */
      .voyage {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 6fr) minmax(0, 6fr);
        min-height: 0;
      }
      .voyage-code {
        border-right: var(--rule) solid var(--ink);
        padding: var(--space-3);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--space-2);
        min-height: 0;
      }
      .voyage-nav { margin-top: var(--space-2); }
      .voyage-caption {
        min-height: 4.6em;
        margin: 0 0 var(--space-2);
        max-width: var(--medida);
      }
      .voyage-caption p {
        margin: 0;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 240ms var(--ease-strong), transform 240ms var(--ease-strong);
      }
      .voyage-caption p.is-leaving { opacity: 0; transform: translateY(-6px); }
      .voyage-caption p.is-entering { opacity: 0; transform: translateY(8px); }

      #voyage-lines {
        contain: content;
        overflow: visible;
        font-family: var(--mono);
        font-size: 1.02rem;
        line-height: 2.2;
        /* the tallest step is five lines; the box is sized for it once,
           so adding a line above never resizes the component */
        min-height: 16.4em;
        background: color-mix(in oklab, var(--ink) 4%, var(--paper));
        border: var(--rule) solid var(--ink);
        padding: var(--space-3) var(--space-3);
        white-space: pre;
      }
      .cline {
        position: relative;
        min-height: 2.2em;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 420ms var(--ease-strong), transform 420ms var(--ease-strong);
      }
      .cline.is-new { opacity: 0; transform: translateY(10px); }
      .cline.is-gone {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
        transition: opacity 300ms var(--ease-strong), transform 300ms var(--ease-strong),
          max-height 360ms var(--ease-move) 80ms;
        overflow: hidden;
      }
      /* the segment is the unit of change: it floats in soft and a
         little blurred, and a replaced one crosses over as a ghost */
      .seg {
        display: inline-block;
        white-space: pre;
        transition: opacity 560ms var(--ease-strong), transform 560ms var(--ease-strong),
          filter 560ms var(--ease-strong);
      }
      .seg-in { opacity: 0; transform: translateY(8px); filter: blur(3px); }
      /* the ink of the language: strings blue, keywords red, links bold */
      .tk-str { color: var(--blue); }
      .tk-kw { color: var(--red); }
      .tk-num { color: var(--red); }
      .tk-fn { font-weight: 700; }
      .seg-out {
        opacity: 0;
        transform: translateY(-5px);
        filter: blur(3px);
      }

      .voyage-verdict {
        font-family: var(--mono);
        font-size: var(--size-sm);
        min-height: 2.6em;
        margin: var(--space-1) 0 0;
        white-space: pre-wrap;
        transition: opacity 200ms var(--ease-strong);
      }

      .voyage-nav {
        display: flex;
        gap: var(--space-1);
        align-items: center;
        margin-top: var(--space-1);
      }
      .voyage-nav button {
        transition: transform 140ms var(--ease-strong);
      }
      .voyage-nav button:active { transform: scale(0.97); }
      .voyage-hint {
        font-family: var(--mono);
        font-size: var(--size-sm);
        opacity: 0.6;
        margin-left: auto;
      }

      /* ── The board side ──────────────────────────────────────────────── */
      .voyage-board {
        display: grid;
        place-items: center;
        padding: var(--space-3);
        min-height: 0;
        position: relative;
      }
      #voyage-table {
        contain: content;
        width: min(80%, 30rem);
        position: relative;
      }
      #voyage-table svg { width: 100%; height: auto; display: block; }
      .board-layer {
        transition: opacity 640ms ease, filter 640ms ease;
      }
      .board-layer--over {
        position: absolute;
        inset: 0;
      }
      /* the shell change: both bodies on screen through the middle */
      .board-layer.is-arriving { opacity: 0; filter: blur(2px); }
      .board-layer.is-yielding { opacity: 0; filter: blur(2px); }
      /* what is cut lifts away as one soft group */
      .board-layer.is-lifting {
        transition: opacity 760ms ease, transform 760ms var(--ease-strong), filter 760ms ease;
        opacity: 0;
        transform: translateY(-2.5%) scale(1.01);
        filter: blur(2px);
      }
      /* the second cube arrives from its own side and welds on */
      .board-layer.is-joining-r { opacity: 0; transform: translate(7%, -7%); filter: blur(2px); }
      .board-layer.is-joining-l { opacity: 0; transform: translate(-7%, 7%); filter: blur(2px); }
      .board-layer--over {
        transition: opacity 820ms var(--ease-strong), transform 820ms var(--ease-strong),
          filter 820ms var(--ease-strong);
      }
      /* the whisper: a recolouring hides in the blur, the body stays */
      .board-layer.is-veiled {
        transition: opacity 160ms ease, filter 160ms ease;
        opacity: 0.85;
        filter: blur(2px);
      }
      #voyage-goal {
        z-index: 2;
        position: absolute;
        right: var(--space-3);
        bottom: var(--space-3);
        width: 7.5rem;
        border: var(--rule) solid var(--ink);
        padding: var(--space-1);
        background: var(--paper);
        opacity: 1;
        transform: translateY(0);
        transition: opacity 240ms var(--ease-strong), transform 240ms var(--ease-strong);
      }
      #voyage-goal[hidden] { display: none; }
      #voyage-goal.is-entering { opacity: 0; transform: translateY(8px); }
      #voyage-goal svg { width: 100%; height: auto; display: block; }
      #voyage-goal .example-label { display: block; margin-bottom: 0.3rem; }

      /* A window too narrow for two columns stacks them ON PURPOSE:
         board above, code below, both whole - never a broken grid. */
      @media (max-width: 56rem) {
        .voyage { grid-template-columns: minmax(0, 1fr); }
        .voyage-code { border-right: none; border-top: var(--rule) solid var(--ink); order: 1; }
        .voyage-board { order: 0; min-height: 40vh; }
        body.example { overflow: auto; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cline, .voyage-caption p, .board-layer {
          transition-property: opacity;
          transition-duration: 150ms;
        }
      }
    </style>
  </head>
  <body class="example">
    <header class="voyage-head">
      <a class="example-back" href="./">erno</a>
      <h1>The chain</h1>
      <span class="voyage-step-title" id="voyage-title"></span>
      <nav class="voyage-dots" id="voyage-dots" aria-label="Steps"></nav>
    </header>

    <main class="voyage">
      <section class="voyage-code">
        <div class="voyage-caption"><p id="voyage-caption"></p></div>
        <div id="voyage-lines" aria-live="off"></div>
        <p class="voyage-verdict demo-readout" id="voyage-verdict"></p>
        <div class="voyage-nav">
          <button id="voyage-prev">Back</button>
          <button id="voyage-next">Next</button>
          <span class="voyage-hint">arrow keys walk · the code is really running</span>
        </div>
      </section>

      <section class="voyage-board">
        <div id="voyage-table"></div>
        <div id="voyage-goal" hidden>
          <span class="example-label">the goal</span>
          <div id="voyage-goal-art"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./voyage.js"></script>
  </body>
</html>
