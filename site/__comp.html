<!doctype html><meta charset=utf-8><pre id=out></pre>
<iframe id=f src="/examples/pattern/" style="width:1100px;height:1800px;border:0"></iframe>
<script>
const say = t => out.textContent += t + "\n";
const wait = ms => new Promise(r => setTimeout(r, ms));
f.onload = () => setTimeout(async () => {
  const d = f.contentDocument, w = f.contentWindow, $ = id => d.getElementById(id);
  const fire = el => el.dispatchEvent(new w.Event("input", {bubbles:true}));
  const clase = () => (($("code-out").textContent.match(/new (\w+)\(/)||[])[1]);
  const teclas = () => { const b=[...$("play-moves").children]; return b.filter(x=>!x.disabled).length + "/" + b.length; };
  const estado = () => $("write-status").textContent.replace(/\s+/g," ").trim();

  $("write-kind").value = "compose"; fire($("write-kind")); await wait(500);
  say("UN CUERPO");
  say("  clase: " + clase() + " | teclas abiertas: " + teclas());
  say("  " + estado());
  say("  filas de cuerpo en pantalla: " + $("body-list").childElementCount);

  $("body-add").click(); await wait(500);
  say("\nDOS CUERPOS (aprete 'Add a body')");
  say("  clase: " + clase() + " | teclas abiertas: " + teclas());
  say("  " + estado());

  $("body-add").click(); await wait(500);
  say("\nTRES CUERPOS");
  say("  clase: " + clase() + " | teclas abiertas: " + teclas());
  say("  " + estado());

  // muevo uno fuera del reticulo
  const inputs = $("body-list").querySelectorAll("input");
  const x2 = inputs[9]; // el x del segundo cuerpo
  x2.value = "2.5"; fire(x2); await wait(500);
  say("\nUNO DESALINEADO (x = 2.5)");
  say("  " + estado());

  x2.value = "2"; fire(x2); await wait(500);
  say("\nDEVUELTO A SU SITIO");
  say("  clase: " + clase() + " | " + estado());

  // y volver a uno solo
  [...$("body-list").querySelectorAll(".body-drop")].pop().click(); await wait(450);
  [...$("body-list").querySelectorAll(".body-drop")].pop().click(); await wait(450);
  say("\nDE VUELTA A UN CUERPO");
  say("  clase: " + clase() + " | teclas abiertas: " + teclas());
  say("\n--- el codigo con dos cuerpos ---");
  $("body-add").click(); await wait(500);
  say($("code-out").textContent.split("\n").slice(0, 16).join("\n"));
}, 2200);
</script>
