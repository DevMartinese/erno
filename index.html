<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>erno — Rubik's cubes to SVG</title>
    <style>
      :root {
        --ink: #0a0a0a;
        --paper: #ffffff;
        --line: #e5e5e5;
        --muted: #737373;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--paper);
        padding: 48px 24px 96px;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
      }
      header {
        margin-bottom: 48px;
      }
      h1 {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      header p {
        margin-top: 8px;
        color: var(--muted);
        max-width: 640px;
      }
      header a {
        color: inherit;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 48px;
        align-items: start;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      #stage {
        aspect-ratio: 1;
        max-width: 560px;
      }
      #stage svg polygon[data-part="sticker"] {
        cursor: pointer;
      }
      .panel section {
        border-top: 1px solid var(--line);
        padding: 16px 0 24px;
      }
      .panel h2 {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .moves {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
      }
      button,
      select,
      input[type="text"] {
        font: inherit;
        color: inherit;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--ink);
      }
      button:active {
        background: var(--ink);
        color: var(--paper);
      }
      .moves button {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        padding: 6px 0;
        text-align: center;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row + .row {
        margin-top: 8px;
      }
      input[type="text"] {
        flex: 1;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        min-width: 0;
      }
      input[type="range"] {
        flex: 1;
        accent-color: var(--ink);
      }
      label {
        font-size: 14px;
        color: var(--muted);
        min-width: 52px;
      }
      .hint {
        margin-top: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      #history {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 14px;
        color: var(--muted);
        margin-top: 16px;
        min-height: 1.5em;
        max-width: 560px;
        word-spacing: 0.25em;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>erno</h1>
        <p>
          A tiny engine for Rubik's cubes rendered to SVG. Moves, scrambles,
          layer animation and per-sticker styling — no WebGL, no canvas, just
          <code>&lt;svg&gt;</code>. Sibling of
          <a href="https://github.com/meodai/heerich">heerich</a>.
        </p>
      </header>

      <div class="layout">
        <div>
          <div id="stage"></div>
          <div id="history"></div>
        </div>

        <div class="panel">
          <section>
            <h2>Algorithm</h2>
            <div class="row">
              <input
                type="text"
                id="alg"
                value="R U R' U'"
                spellcheck="false"
                aria-label="Move sequence"
              />
              <button id="play">Play</button>
            </div>
            <div class="row">
              <button id="scramble">Scramble</button>
              <button id="reset">Reset</button>
            </div>
          </section>

          <section>
            <h2>Moves</h2>
            <div class="moves" id="moveButtons"></div>
            <p class="hint">Shift-click for the inverse (R&thinsp;&rarr;&thinsp;R&#8242;).</p>
          </section>

          <section>
            <h2>Cube</h2>
            <div class="row">
              <label for="size">Size</label>
              <select id="size">
                <option value="2">2×2</option>
                <option value="3" selected>3×3</option>
                <option value="4">4×4</option>
                <option value="5">5×5</option>
                <option value="6">6×6</option>
              </select>
            </div>
            <div class="row">
              <label for="camera">Camera</label>
              <select id="camera">
                <option value="isometric" selected>isometric</option>
                <option value="orthographic">orthographic</option>
                <option value="oblique">oblique</option>
                <option value="perspective">perspective</option>
              </select>
            </div>
            <div class="row">
              <label for="angle">Angle</label>
              <input type="range" id="angle" min="-90" max="90" value="30" />
            </div>
            <div class="row">
              <label for="preset">Style</label>
              <select id="preset">
                <option value="classic" selected>classic</option>
                <option value="stickerless">stickerless</option>
                <option value="cross">tutorial: cross</option>
                <option value="grayscale">grayscale + F2L pair</option>
              </select>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script type="module">
      import { Erno } from "./src/erno.js";

      const stage = document.getElementById("stage");
      const historyEl = document.getElementById("history");
      const $ = (id) => document.getElementById(id);

      let cube;
      let animating = false;
      let generation = 0; // bumped on rebuild so stale animations abort

      const PRESETS = {
        classic: (c) => {
          c.stickerInset = 0.12;
          c.style(null);
        },
        stickerless: (c) => {
          c.stickerInset = 0;
          c.style({ stroke: "#0d0d0d", strokeWidth: 2 });
        },
        cross: (c) => {
          // gray out everything except centers and the D-cross positions
          c.stickerInset = 0.12;
          c.style(({ face, row, col }) => {
            const mid = Math.floor(c.size / 2);
            const isCenter = row === mid && col === mid;
            const dCross = face === "D" && (row === mid || col === mid);
            const sideBottom =
              face !== "U" && face !== "D" && row === c.size - 1 && col === mid;
            return isCenter || dCross || sideBottom
              ? null
              : { fill: "#d4d4d4" };
          });
        },
        grayscale: (c) => {
          c.stickerInset = 0.12;
          c.style(({ face, row, col }) => {
            const pair =
              (face === "F" && row >= 1 && col === c.size - 1) ||
              (face === "R" && row >= 1 && col === 0);
            return pair ? null : { fill: "#d4d4d4" };
          });
        },
      };

      function buildCube() {
        generation++;
        animating = false;
        cube = new Erno({
          size: parseInt($("size").value, 10),
          tile: 40,
          camera: cameraSpec(),
        });
        PRESETS[$("preset").value](cube);
        render();
      }

      function cameraSpec() {
        const type = $("camera").value;
        const angle = parseFloat($("angle").value);
        if (type === "perspective") {
          const n = parseInt($("size").value, 10);
          return {
            type,
            position: [n / 2 + (angle / 30) * n, -n * 0.7],
            distance: n * 3.5,
          };
        }
        return { type, angle };
      }

      function render(turn) {
        stage.innerHTML = cube.toSVG({ fitSphere: true, turn });
        historyEl.textContent = cube.history.join(" ");
      }

      const DURATION = 180; // ms per quarter turn

      function animateMoves(tokens, done) {
        const myGeneration = generation;
        if (!tokens.length) {
          animating = false;
          if (done) done();
          return;
        }
        animating = true;
        const [token, ...rest] = tokens;
        const quarters = Math.abs(cube.parseMove(token).quarters);
        const total = DURATION * Math.max(1, quarters);
        const start = performance.now();
        function frame(now) {
          if (generation !== myGeneration) return; // cube was rebuilt
          const p = Math.min(1, (now - start) / total);
          const eased = 1 - Math.pow(1 - p, 3);
          render({ move: token, progress: eased });
          if (p < 1) {
            requestAnimationFrame(frame);
          } else {
            cube.move(token);
            render();
            animateMoves(rest, done);
          }
        }
        requestAnimationFrame(frame);
      }

      function playSequence(seq) {
        if (animating) return;
        const tokens = seq.trim().split(/[\s,]+/).filter(Boolean);
        try {
          tokens.forEach((t) => cube.parseMove(t));
        } catch (err) {
          historyEl.textContent = err.message;
          return;
        }
        animateMoves(tokens);
      }

      // ── Controls ─────────────────────────────────────────────────────────

      const MOVE_KEYS = ["R", "L", "U", "D", "F", "B", "M", "E", "S", "x", "y", "z"];
      const movesEl = $("moveButtons");
      for (const m of MOVE_KEYS) {
        const b = document.createElement("button");
        b.textContent = m;
        b.addEventListener("click", (e) =>
          playSequence(e.shiftKey ? m + "'" : m),
        );
        movesEl.appendChild(b);
      }

      $("play").addEventListener("click", () => playSequence($("alg").value));
      $("alg").addEventListener("keydown", (e) => {
        if (e.key === "Enter") playSequence($("alg").value);
      });
      $("scramble").addEventListener("click", () => {
        if (animating) return;
        const seq = new Erno({ size: cube.size }).scramble();
        $("alg").value = seq;
        animateMoves(seq.split(" "));
      });
      $("reset").addEventListener("click", () => {
        if (animating) return;
        cube.reset();
        render();
      });
      $("size").addEventListener("change", buildCube);
      $("preset").addEventListener("change", () => {
        PRESETS[$("preset").value](cube);
        render();
      });
      $("camera").addEventListener("change", () => {
        cube.setCamera(cameraSpec());
        render();
      });
      $("angle").addEventListener("input", () => {
        cube.setCamera(cameraSpec());
        render();
      });

      buildCube();
    </script>
  </body>
</html>
