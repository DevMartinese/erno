<!-- Collects, from the running page, the code it prints and the picture it
     draws, for tests/browser/verify-snippets.mjs to check against each other.
     Serve the site, open this, and save the JSON it writes into the page. -->
<!doctype html><meta charset=utf-8><pre id=out></pre>
<iframe id=f src="/../site/examples/pattern/" style="width:1100px;height:1600px;border:0"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
f.onload = () => setTimeout(async () => {
  const d = f.contentDocument, w = f.contentWindow, $ = id => d.getElementById(id);
  const fire = el => el.dispatchEvent(new w.Event("input", {bubbles:true}));
  const casos = [];
  const huella = () => [...$("play-canvas").querySelectorAll("polygon")]
    .map(p => p.getAttribute("points") + "|" + p.getAttribute("fill")).join("\n");
  const grab = e => casos.push({ etiqueta: e, code: $("code-out").textContent, huella: huella() });
  const mover = async k => { const b=[...$("play-moves").children].filter(x=>!x.disabled); for(let i=0;i<k;i++){ b[i%b.length].click(); await wait(90);} };
  grab("recien mezclado");
  await mover(3); grab("mezclado + tres giros");
  const s2 = $("seq-input"); s2.value = "[R, U]"; fire(s2); await wait(80); grab("secuencia escrita, sin correr");
  $("seq-run").click(); await wait(250); grab("y tras correrla");
  $("play-reset").click(); await wait(120); grab("tras Reset");
  $("play-start").click(); await wait(150); grab("tras Scramble");
  $("write-code").value = "return hypot(x, y, z) > n - 1.2 ? 6 : 0"; fire($("write-code")); await wait(450);
  await mover(2); grab("paleta por numero");
  // el compuesto, cuerpo a cuerpo
  $("write-kind").value = "compose"; fire($("write-kind")); await wait(500);
  await mover(2); grab("compuesto, un cuerpo");
  $("body-add").click(); await wait(550); await mover(2); grab("compuesto, dos cuerpos");
  $("body-add").click(); await wait(550); await mover(2); grab("compuesto, tres cuerpos");
  {
    const inputs = $("body-list").querySelectorAll("input");
    inputs[3].value = "2"; fire(inputs[3]); await wait(550);   // achico el primero
    await mover(1); grab("compuesto con un cuerpo mas chico");
  }
  for (const k of ["cuboid","void","siamese","fused"]) {
    $("write-kind").value = k; fire($("write-kind"));
    if (k === "cuboid") { $("write-size").value = "5"; fire($("write-size")); }
    await wait(500); await mover(2); grab(k);
  }
  out.textContent = JSON.stringify(casos);
}, 2200);
</script>
